workflows:
  android-debug-apk:
    name: Build Android Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set up environment and restore debug keystore
        script: |
          mkdir -p ~/.android
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
            cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          fi
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          # Accept Android SDK Licenses
          yes | sdkmanager --licenses 2>/dev/null || yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
      - name: Build Debug APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug -x test --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/outputs/**/*.apk
